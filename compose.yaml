services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siroquizz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siroquizz_local_only}
      POSTGRES_DB: siroquizz
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siroquizz -d siroquizz"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
