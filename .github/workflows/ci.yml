name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_PUBLIC_DATA_SOURCE: http
      DEPLOYMENT_ENV: local
      DATABASE_URL: postgresql://siroquizz:siroquizz_ci_only@localhost:5432/siroquizz
      TEST_DATABASE_URL: postgresql://siroquizz:siroquizz_ci_only@localhost:5432/siroquizz_test
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production-0123456789
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      CI: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siroquizz
          POSTGRES_PASSWORD: siroquizz_ci_only
          POSTGRES_DB: siroquizz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siroquizz -d siroquizz"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm db:migrate
      - name: Create isolated integration database
        run: node --input-type=module -e 'import postgres from "postgres"; const db = postgres(process.env.DATABASE_URL); await db.unsafe("CREATE DATABASE siroquizz_test"); await db.end();'
      - run: pnpm test:integration --coverage
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright's webServer command builds the production app before starting it.
      - run: pnpm e2e --workers=2 --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
